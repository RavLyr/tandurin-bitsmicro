<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<style>

                        "headline": ["Plus Jakarta Sans"],

            }

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
</head>
<body class="bg-background font-body text-text flex items-center justify-center min-h-screen p-4">
<main class="w-full max-w-[420px] bg-surface rounded-lg shadow-sm border border-outline-variant p-6 sm:p-8">
<div class="flex flex-col items-center mb-8 text-center">
<img alt="Tanduri Logo" class="w-16 h-16 rounded-lg mb-4 object-cover" src="https://lh3.googleusercontent.com/aida/AP1WRLsN3WToSxXeYAuu-HML2e5qqj9mtZ5VO52UfI0FJucc8h65uDwE2JjsVMJfR4zh3tDRWTpXa-MFFWPeby_K0u0-MZr8kvdVSa_B1TBggOSk2XEdOUErSZaWENI3PhQZE_-kWnZ63tQaLgT7BDrdGKhcckmsUc5Y1j27sI9Tdh_Zv5hjUGAv7DWOSo4l9XN4VfP7_aiWCaqLjn-WZpHLQBHVL7RLUHTTk6MTlmv_m1qzQto6hEJO8BMsOGSM"/>
<h1 class="text-2xl font-bold mb-1">Tanduri.</h1>
<p class="text-text-muted text-sm">Solusi Tani Zaman Saiki</p>
</div>
<form class="flex flex-col gap-4">
<div class="flex flex-col gap-1.5">
<label class="text-sm font-semibold text-text" for="name">Nama (opsional)</label>
<input class="w-full px-3 py-2 border border-outline-variant rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-text placeholder-text-muted transition-shadow" id="name" name="name" placeholder="Nama Anda" type="text"/>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-sm font-semibold text-text" for="email">Email</label>
<input class="w-full px-3 py-2 border border-outline-variant rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-text placeholder-text-muted transition-shadow" id="email" name="email" placeholder="email@contoh.com" required="" type="email"/>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-sm font-semibold text-text" for="password">Kata Sandi</label>
<div class="relative">
<input class="w-full px-3 py-2 border border-outline-variant rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-text placeholder-text-muted transition-shadow pr-10" id="password" name="password" placeholder="Masukkan kata sandi" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 flex items-center pr-3 text-text-muted hover:text-text focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<button class="w-full bg-primary hover:bg-primary-container text-white font-bold py-2.5 px-4 rounded-md transition-colors mt-2" type="submit">
                Daftar
            </button>
</form>
<div class="flex items-center gap-3 my-6">
<div class="h-px bg-outline-variant flex-1"></div>
<span class="text-sm text-text-muted">atau</span>
<div class="h-px bg-outline-variant flex-1"></div>
</div>
<button class="w-full bg-surface border border-outline-variant hover:bg-surface-container-low text-text font-semibold py-2.5 px-4 rounded-md flex items-center justify-center gap-2 transition-colors mb-6" type="button">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
            Lanjutkan dengan Google
        </button>
<p class="text-center text-sm text-text-muted">
            Sudah punya akun? <a class="text-primary hover:underline font-semibold" href="/login">Masuk</a>
</p>
</main>
</body></html>
